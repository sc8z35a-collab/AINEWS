name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run verify
      - name: Upload verification bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics-node-${{ matrix.node-version }}
          path: |
            dist/
            data/runtime-state.json
          if-no-files-found: ignore
